site_name: 新火集
site_url: https://xinhuoji.netlify.app/
theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.path
    - navigation.prune
    - navigation.indexes
  palette:
    - scheme: slate
      toggle:
        icon: material/eye
        name: Dark mode
      primary: blue grey
      accent: deep blue
    - scheme: default
      toggle:
        icon: material/eye-outline
        name: Light mode
      primary: blue grey
      accent: light blue
  favicon: logo.png
  logo: logo.png
nav:
  - 主页: index.md
  - test section:
    - test/index.md
    - Poem: test/1.md
plugins:
  - tags
  - search:
      lang: zh
      jieba_dict: dict.txt
  - optimize:
      optimize: false
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
extra_css:
  - css/extra.css
extra_javascript:
  - js/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js